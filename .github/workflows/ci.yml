name: ci

# The checks: a pull request and the merge queue run every one (the full suite in shards): each push of a lot gets the
# whole answer early, and the queue proves the lot on top of main and the lots ahead of it. The push to main that the
# queue's merge makes is publish.yml's: it builds and publishes, never tests again.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  merge_group:

# a new push of a pull request cancels the run it supersedes; queue runs always finish
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: Install Dependencies
    uses: ./.github/workflows/_install.yml

  build:
    name: Build Project
    needs: install
    uses: ./.github/workflows/_build.yml

  test:
    name: Run Tests
    needs: install
    uses: ./.github/workflows/_test.yml

  lint:
    name: Lint Code
    needs: install
    uses: ./.github/workflows/_lint.yml

  # the one check the ruleset requires: green only when every check of this run passed (none skipped)
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - build
      - test
      - lint
    runs-on: ubuntu-24.04
    steps:
      - name: Every check passed
        run: |
          echo "build=${{ needs.build.result }} test=${{ needs.test.result }} lint=${{ needs.lint.result }}"
          test "${{ needs.build.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.lint.result }}" = success
