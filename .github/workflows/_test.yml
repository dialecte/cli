name: _test

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # the suite in 8 shards on 8 runners: each runs an eighth of the test files (vitest --shard), all must pass
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: test (shard ${{ matrix.shard }}/8)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install xmllint (libxml2-utils)
        run: sudo apt-get install -y libxml2-utils

      # the tdd pytest runner's tests run pytest through python3; the xdist case needs pytest-xdist;
      # pinned to the versions known green (a new release lands by a change here)
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest and pytest-xdist
        run: python -m pip install pytest==9.0.2 pytest-xdist==3.8.0

      - name: Run Tests
        env:
          DIALECTE_XDIST_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: npx vitest run --shard=${{ matrix.shard }}/8

  # the config homes differ per platform (%APPDATA%, path keys compared whatever the case): their tests on Windows
  config-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      # the install workflow fills the Linux cache only: a Windows cache miss installs here
      - name: Install dependencies
        run: npm ci
        if: steps.cache-node-modules.outputs.cache-hit != 'true'

      - name: Run config tests
        run: npx vitest run src/lib/config/ src/commands/config src/lib/release/
